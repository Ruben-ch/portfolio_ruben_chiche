<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320">
  <!-- Motif répétable : maillage réseau ; les liens verts en pointillés
       représentent les chemins de secours d'un réseau auto-réparateur -->
  <g stroke="#bfe3ff" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <line x1="40" y1="50" x2="150" y2="90"/>
    <line x1="150" y1="90" x2="260" y2="40"/>
    <line x1="260" y1="40" x2="380" y2="80"/>
    <line x1="380" y1="80" x2="480" y2="50"/>
    <line x1="0" y1="50" x2="40" y2="50"/>
    <line x1="150" y1="90" x2="190" y2="200"/>
    <line x1="260" y1="40" x2="300" y2="170"/>
    <line x1="380" y1="80" x2="420" y2="210"/>
    <line x1="40" y1="50" x2="80" y2="180"/>
    <line x1="80" y1="180" x2="190" y2="200"/>
    <line x1="190" y1="200" x2="300" y2="170"/>
    <line x1="300" y1="170" x2="420" y2="210"/>
    <line x1="80" y1="180" x2="40" y2="290"/>
    <line x1="190" y1="200" x2="160" y2="300"/>
    <line x1="300" y1="170" x2="330" y2="280"/>
    <line x1="420" y1="210" x2="460" y2="300"/>
    <line x1="40" y1="290" x2="160" y2="300"/>
    <line x1="330" y1="280" x2="460" y2="300"/>
    <line x1="40" y1="290" x2="40" y2="320"/>
    <line x1="40" y1="0" x2="40" y2="50"/>
    <line x1="420" y1="210" x2="480" y2="190"/>
    <line x1="0" y1="190" x2="80" y2="180"/>
  </g>
  <!-- Lien coupé (rouge) et chemin de secours (vert) -->
  <line x1="160" y1="300" x2="330" y2="280" stroke="#ff8a8a" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 8"/>
  <path d="M160 300 Q245 235 330 280" stroke="#7CFFB2" stroke-opacity="0.75" stroke-width="2.5" stroke-dasharray="8 6" fill="none"/>
  <path d="M150 90 Q205 150 260 40" stroke="#7CFFB2" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="4" fill-opacity="0.7"/>
    <circle cx="150" cy="90" r="5" fill-opacity="0.8"/>
    <circle cx="260" cy="40" r="4" fill-opacity="0.7"/>
    <circle cx="380" cy="80" r="5" fill-opacity="0.8"/>
    <circle cx="80" cy="180" r="4" fill-opacity="0.6"/>
    <circle cx="190" cy="200" r="6" fill-opacity="0.85"/>
    <circle cx="300" cy="170" r="5" fill-opacity="0.75"/>
    <circle cx="420" cy="210" r="4" fill-opacity="0.65"/>
    <circle cx="40" cy="290" r="4" fill-opacity="0.6"/>
    <circle cx="160" cy="300" r="5" fill-opacity="0.75"/>
    <circle cx="330" cy="280" r="5" fill-opacity="0.75"/>
    <circle cx="460" cy="300" r="4" fill-opacity="0.6"/>
  </g>
  <!-- Halos verts : nœuds qui se sont "réparés" -->
  <g fill="none" stroke="#7CFFB2" stroke-opacity="0.6" stroke-width="1.5">
    <circle cx="190" cy="200" r="13"/>
    <circle cx="330" cy="280" r="11"/>
    <circle cx="150" cy="90" r="11"/>
  </g>
</svg>
